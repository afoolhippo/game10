<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>サルトリイバラ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

  <div id="titleScreen" class="screen active">
    <img id="titleImage" src="title.png" alt="サルトリイバラ">
    <div class="ruleText">
      トゲをよけて<br>
      バナナをめざせ！
    </div>
    <button id="startBtn">タップしてスタート</button>
  </div>

  <div id="playScreen" class="screen">
    <button id="backBtn">タイトルへ戻る</button>

    <div id="hud">
      <span id="stageText">STAGE 1</span>
      <span id="hpText">♥♥♥♥♥</span>
    </div>

    <svg id="vineLayer"></svg>

    <img id="banana" src="banana.png" alt="banana">
    <img id="monkey" src="saru.png" alt="saru">

    <div id="damageText">イタッ</div>

    <div id="controls">
      <button id="upBtn">▲</button>
      <button id="downBtn">▼</button>
    </div>

    <div id="countdown"></div>
    <div id="fade"></div>
  </div>

  <div id="resultScreen" class="screen">
    <h2 id="resultTitle">称号</h2>
    <img id="resultCharacter" src="result_normal.png" alt="result">
    <div id="resultMessage"></div>

    <div id="resultButtons">
      <button id="shareBtn">Xでシェア</button>
      <button id="retryBtn">もう1回遊ぶ</button>
      <button id="homeBtn">カバゲーセンへ</button>
    </div>
  </div>

</div>

<audio id="bgm" src="bgm.mp3" preload="auto"></audio>

<script src="game.js"></script>
</body>
</html>
